
name: CI

on:
  push:
  pull_request:

jobs:
  quality-checks:
    runs-on: ubuntu-latest

    env:
      API_URL: https://dummyjson.com

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build
